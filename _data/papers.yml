# ────────────── Working Papers ──────────────
- title: "United We Speak: Antidumping Investigations and Product Market Cost Coordination"
  authors: "with Omrane Guedhami, Qiang Wu, Colin Zeng"
  type: working
  year: 2026
  status: "First-Year Summer Paper"
  abstract: >-
    This paper examines whether antidumping investigations initiated by foreign governments affect cost coordination among targeted U.S. firms. We find a significant increase in coordination of production costs, the primary input in dumping-margin calculations, following an investigation. This effect is more pronounced when targeted firms have greater exposure to the investigation, when U.S. relations with the initiating country are less favorable, and when coordination costs are lower. Additional analyses suggest that our findings are unlikely to be driven by correlated fundamental changes in costs. We also find that, following an investigation, treated firms are more likely to issue below-consensus management forecasts aligned with those of their product-market peers, suggesting that strategic coordination can extend to firms’ voluntary disclosures. We further show that cost coordination is associated with shorter investigation durations and more uniform duty margins across firms, suggesting that coordination is an effective collective response to antidumping investigations. Overall, the paper provides novel evidence that international trade frictions can shape product-market-level coordination in firms’ cost behavior.
  award: "PolyU AF Doctoral Consortium 2026 Best Paper Award"
  presented:
    - "EAA Annual Congress 2026"
    - "AsianFA 2026"
    - "AAA Annual Meeting 2026"
    - "JAAF 2026"
    - "HARC 2027"
